<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FCE Key Word Transformations</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1d2433;--m:#6b7280;--a:#4f46e5;--ok:#16a34a;--no:#dc2626;--b:#d9dce5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--c:#1c2030;--t:#e8eaf2;--m:#9aa1b5;--a:#8b85ff;--b:#33384d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc{color:var(--m);font-size:14px}
.bar{height:6px;background:var(--b);border-radius:3px;margin:10px 0}.bar i{display:block;height:100%;background:var(--a);border-radius:3px}
.q{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:12px 0}
.o{margin:0 0 6px}.k{display:inline-block;background:var(--a);color:#fff;font-weight:700;padding:1px 10px;border-radius:6px;margin:4px 0}
.g{margin:6px 0}input{font:inherit;color:var(--t);background:var(--bg);border:2px solid var(--b);border-radius:8px;padding:4px 8px;width:min(220px,100%)}
input.ok{border-color:var(--ok)}input.no{border-color:var(--no)}
button{font:inherit;border:0;border-radius:8px;padding:8px 14px;background:var(--a);color:#fff;cursor:pointer}
button.s{background:transparent;color:var(--a);border:1px solid var(--a)}button:disabled{opacity:.4}
.f{font-size:14px;margin-top:6px;min-height:20px}.nav{display:flex;justify-content:space-between;margin:16px 0}
.row{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
</style></head><body><div class="w">
<div class="top"><h1>FCE Key Word Transformations</h1><span class="sc" id="sc"></span></div>
<div class="bar"><i id="pb"></i></div>
<h2 id="tt" style="font-size:18px;margin:8px 0"></h2>
<p class="sc" style="margin:0">Complete the second sentence using the key word, 2–5 words in total. Do not change the key word.</p>
<div id="qs"></div>
<div class="nav"><button class="s" id="pv">← Back</button><button id="nx">Next →</button></div>
</div>
<script>
const D=`#Passive voice
Everyone believes the painting is a fake.|BELIEVED|The painting ___ a fake.|is believed to be
The council has not yet decided who will manage the project.|BEEN|It has ___ will manage the project.|not yet been decided who
Nobody told me that the meeting had been cancelled.|INFORMED|I ___ that the meeting had been cancelled.|was not informed/wasn't informed
People think the minister resigned last night.|THOUGHT|The minister ___ resigned last night.|is thought to have
The company expects every employee to wear a uniform.|EXPECTED|Every employee ___ a uniform.|is expected to wear
#Reported speech
"I didn't take your pen," said Tom.|DENIED|Tom ___ my pen.|denied taking
"If I were you, I'd accept the offer," Maria told him.|ADVISED|Maria ___ the offer.|advised him to accept
"I'm sorry I forgot your birthday," said Paul.|APOLOGISED|Paul ___ my birthday.|apologised for forgetting
"You broke the window!" Kate said to her brother.|ACCUSED|Kate ___ the window.|accused her brother of breaking
"Don't forget to lock up," the manager told Ben.|REMINDED|The manager ___ up.|reminded Ben to lock
#Conditionals
Take an umbrella or you'll get wet.|OTHERWISE|Take an umbrella, ___ wet.|otherwise you'll get
You can borrow it if you return it tomorrow.|PROVIDED|You can borrow it ___ it tomorrow.|provided you return
I only passed the exam because you helped me.|FOR|If it ___ help, I wouldn't have passed the exam.|hadn't been for your/had not been for your
If the weather hadn't been so bad, we'd have gone sailing.|HAD|___ so bad, we would have gone sailing.|Had the weather not been/Had the weather not been
If you need any help, just ask me.|SHOULD|___ any help, just ask me.|Should you need
#Wish / if only / would rather / it's time
I'd prefer you not to smoke here.|RATHER|I'd ___ here.|rather you didn't smoke
I regret buying this car.|BOUGHT|If only ___ this car.|I hadn't bought
People always interrupt me, and I find it annoying.|WISH|I ___ interrupting me.|wish people would stop
You should have started taking your studies seriously long ago.|TIME|It's ___ your studies seriously.|high time you took/about time you took
I didn't want you to tell her, but you did.|RATHER|I'd ___ her.|rather you hadn't told
#Comparatives and superlatives
The more you practise, the better you play.|MORE|The ___ play.|more you practise, the better you
The blue car is far more expensive than the red one.|NOWHERE|The red car is ___ expensive as the blue one.|nowhere near as
Nobody in the team works as hard as Helen.|HARDEST|Helen ___ the team.|works the hardest in/is the hardest worker in
The hotel was more expensive than we'd expected.|AS|The hotel wasn't ___ expected.|as cheap as we'd/as cheap as we had
Sales are almost the same as last year.|NEARLY|Sales are ___ they were last year.|nearly as high as/nearly as good as
#Modal verbs
It was wrong of you not to apologise.|SHOULD|You ___.|should have apologised
It's possible that Harry forgot about the appointment.|MAY|Harry ___ about the appointment.|may have forgotten
I'm certain she wasn't telling the truth.|CAN'T|She ___ the truth.|can't have been telling
It wasn't necessary to book a table, but we did.|NEEDN'T|We ___ a table.|needn't have booked
I'm sure the shop will be closed by now.|BOUND|The shop ___ closed by now.|is bound to be
#Gerunds and infinitives
I didn't lock the door, and now I'm sorry.|REGRET|I ___ the door.|regret not locking
I can't wait to see you.|FORWARD|I ___ you.|look forward to seeing
She didn't mean to hurt you.|INTENTION|She ___ you.|had no intention of hurting
It's pointless to complain to the manager.|POINT|There ___ to the manager.|is no point complaining/is no point in complaining
I don't like people asking me about my salary.|OBJECT|I ___ about my salary.|object to being asked/object to people asking
#Causative: have / get something done
Someone stole his phone on the train.|HAD|He ___ on the train.|had his phone stolen
I'll arrange for a plumber to fix the leak tomorrow.|HAVE|I'm going to ___ tomorrow.|have the leak fixed
Someone broke into the Smiths' house while they were away.|HAD|The Smiths ___ while they were away.|had their house broken into
I asked a colleague to proofread my report.|GOT|I ___ by a colleague.|got my report proofread
A firm is redecorating our flat at the moment.|HAVING|We ___ by a firm.|are having our flat redecorated
#Relative clauses
That's the woman. Her car was stolen.|WHOSE|That's the woman ___ stolen.|whose car was
The girl is my cousin. You met her.|WHOM|The girl ___ my cousin.|whom you met is
The company employs 500 people. Most of them are local.|WHOM|The company employs 500 people, ___ local.|most of whom are
Illness was the reason for her absence.|WHY|Illness is ___ absent.|the reason why she was
That's the house. I grew up in it.|WHICH|That's the house ___ up.|in which I grew
#Tense forms
When did you start learning French?|LONG|How ___ French?|long have you been learning
I haven't been to the cinema for over a year.|SINCE|It's ___ I went to the cinema.|over a year since
This is the first time I've flown business class.|NEVER|I ___ business class before.|have never flown
The meeting started before I got there.|BY|The meeting ___ I got there.|had started by the time
She's still writing her report. She started at nine.|BEEN|She ___ her report since nine o'clock.|has been writing
#Phrasal verbs
She invented an excuse.|CAME|She ___ an excuse.|came up with
I can't tolerate his bad manners any longer.|PUT|I can't ___ his bad manners any longer.|put up with
The festival was cancelled because of bad weather.|CALLED|They ___ because of bad weather.|called off the festival/called the festival off
I'll investigate the complaint.|LOOK|I'll ___ the complaint.|look into
She finally recovered from the flu.|OVER|She finally ___ the flu.|got over
#Fixed phrases and collocations
He used the chance well.|ADVANTAGE|He ___ the chance.|took advantage of
Ignore what he says.|NOTICE|Don't ___ he says.|take any notice of what
The new regulations will take effect next month.|FORCE|The new regulations ___ next month.|will come into force/come into force
It doesn't matter to me which restaurant we choose.|DIFFERENCE|It ___ to me which restaurant we choose.|makes no difference
Everyone was surprised when she resigned.|COME|Her resignation ___ everyone.|came as a surprise to/came as a shock to
#Prepositional phrases
The flight was cancelled because of fog.|DUE|The cancellation ___ fog.|was due to
As well as being cheap, the flat is close to the station.|ADDITION|In ___ cheap, the flat is close to the station.|addition to being
I assembled the shelf by following the instructions.|ACCORDANCE|I assembled the shelf ___ the instructions.|in accordance with
I am writing for my manager, who is away.|BEHALF|I am writing ___ my manager, who is away.|on behalf of
Everyone must wear a helmet, whatever their age.|REGARDLESS|Everyone must wear a helmet ___ age.|regardless of their/regardless of
#Linking words
Although it was late, we kept working.|DESPITE|We kept working ___ late.|despite it being
I took a map because I might get lost.|CASE|I took a map ___ lost.|in case I got
I like her a lot, but I wouldn't trust her.|MUCH|___ her, I wouldn't trust her.|Much as I like
He trained very hard but he still lost.|HOWEVER|___, he still lost.|However hard he trained
She spoke quietly to avoid waking the baby.|SO|She spoke quietly ___ the baby.|so as not to wake
#Quantifiers: too / enough / so / such
The box is so heavy that I can't lift it.|TOO|The box is ___ lift.|too heavy for me to
There were very few tickets left.|HARDLY|There ___ tickets left.|were hardly any
The room was too dark for us to read.|ENOUGH|The room ___ for us to read.|wasn't light enough/was not light enough/wasn't bright enough/was not bright enough
The exam was so hard that many students failed.|SUCH|It ___ that many students failed.|was such a hard exam/was such a difficult exam
Both of the proposals are unacceptable.|NEITHER|___ proposals is acceptable.|Neither of the
#Inversion
As soon as she sat down, the phone rang.|SOONER|___ down than the phone rang.|No sooner had she sat
As soon as we arrived, it started to rain.|HARDLY|___ when it started to rain.|Hardly had we arrived
You must not open this door under any circumstances.|NO|Under ___ open this door.|no circumstances must you
She had no idea that she would win.|LITTLE|___ that she would win.|Little did she know/Little did she realise/Little did she imagine
He has rarely been so embarrassed.|RARELY|___ so embarrassed.|Rarely has he been
#Word-class changes
They argued fiercely.|ARGUMENT|They ___.|had a fierce argument
The company grew so quickly that everyone was surprised.|GROWTH|They were surprised at ___ the company.|the rapid growth of/the fast growth of/the speedy growth of
She's extremely good at persuading people.|PERSUASIVE|She is ___.|extremely persuasive/very persuasive
We were very disappointed by the results.|DISAPPOINTMENT|The results ___ us.|were a great disappointment to/were a disappointment to/were a big disappointment to
They treated us very kindly.|KINDNESS|They ___ us.|showed us great kindness/showed great kindness to
#Time expressions
The film had ended before we got there.|TIME|___ got there, the film had ended.|By the time we
He started working at 9 and is still working.|BEEN|He ___ 9.|has been working since
It's ages since we last met.|SEEN|We ___ ages.|haven't seen each other for/have not seen each other for
The phone rang as I was leaving.|JUST|I ___ the phone rang.|was just leaving when
We'll email you as soon as the results are published.|ONCE|We'll email you ___ published.|once the results are
#Purpose, result and reason
Because of the strike, trains were late.|RESULT|Trains were late ___ strike.|as a result of the
He worked hard, so he passed.|LED|His hard work ___ passing.|led to his
She wore gloves so that her hands wouldn't get cold.|PREVENT|She wore gloves ___ her hands getting cold.|to prevent
The match was postponed because of the storm.|OWING|The match was postponed ___ storm.|owing to the
Mia moved abroad hoping to find a better job.|WITH|Mia moved abroad ___ finding a better job.|with a view to/with the aim of
#Verb patterns
The rain stopped us going.|PREVENTED|The rain ___ going.|prevented us from
"Why don't you see a doctor?" he said to me.|ADVISED|He ___ a doctor.|advised me to see
My boss said the delay was my fault.|BLAMED|My boss ___ the delay.|blamed me for
They persuaded me to take the job.|TALKED|They ___ the job.|talked me into taking
I'm thinking of applying for the post.|CONSIDERING|I'm ___ for the post.|considering applying`;
const T=[];D.split('\n').forEach(l=>{if(l[0]=='#')T.push({n:l.slice(1),q:[]});else{const p=l.split('|');T[T.length-1].q.push({o:p[0],k:p[1],g:p[2],a:p[3]})}});
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?]/g,'').replace(/\s+/g,' ').trim();
let cur=0;const done={};
const $=i=>document.getElementById(i);
function sc(){const n=Object.values(done).filter(Boolean).length;$('sc').textContent=n+' / 100 correct'}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function show(){const t=T[cur];$('tt').textContent=(cur+1)+'/20 · '+t.n;$('pb').style.width=((cur+1)*5)+'%';
$('qs').innerHTML=t.q.map((x,i)=>{const id=cur+'-'+i,[a,b]=esc(x.g).split('___');
return `<div class="q"><p class="o">${i+1}. ${esc(x.o)}</p><span class="k">${x.k}</span><div class="g">${a}<input id="i${id}" autocomplete="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key=='Enter')ck('${id}')">${b}</div><div class="row"><button onclick="ck('${id}')">Check</button><button class="s" onclick="rv('${id}')">Show answer</button></div><div class="f" id="f${id}"></div></div>`}).join('');
t.q.forEach((x,i)=>{const id=cur+'-'+i;if(done[id]!==undefined)mark(id,done[id])});
$('pv').disabled=cur==0;$('nx').disabled=cur==19;window.scrollTo(0,0);sc()}
function mark(id,ok){const [c,i]=id.split('-'),x=T[c].q[i],inp=$('i'+id);inp.className=ok?'ok':'no';
$('f'+id).innerHTML=ok?'✅ Correct!':'❌ Try again, or tap Show answer.'}
function ck(id){const [c,i]=id.split('-'),x=T[c].q[i],v=norm($('i'+id).value);if(!v)return;const ok=x.a.split('/').some(a=>norm(a)==v);if(ok||done[id]===undefined)done[id]=ok||done[id]||false;if(ok)done[id]=true;mark(id,ok);sc()}
function rv(id){const [c,i]=id.split('-'),x=T[c].q[i];$('f'+id).innerHTML='💡 <b>'+esc(x.a.split('/').join('  /  '))+'</b>';if(done[id]===undefined)done[id]=false;sc()}
$('pv').onclick=()=>{cur--;show()};$('nx').onclick=()=>{cur++;show()};show();
</script></body></html>
